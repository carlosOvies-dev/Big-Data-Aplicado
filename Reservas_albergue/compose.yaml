# Reservas de albergues do Camiño Aberto (ficticio)
name: reservas-albergues

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgresdatos:/var/lib/postgresql/data
    ports:
      - "${PGPORT}:5432"
    networks:
      - albergues
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      start_period: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4
    # --appendonly yes activa a persistencia AOF
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redisdatos:/data
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - albergues
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodatos:/data/db
    ports:
      - "${MONGO_PORT}:27017"
    networks:
      - albergues
    command: ["mongod", "--quiet"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      start_period: 30s
      timeout: 5s
      retries: 5

volumes:
  postgresdatos:
  redisdatos:
  mongodatos:

networks:
  albergues:
